[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-red-team"
version = "0.1.0"
description = "Open-source Investment Red-Team framework with 4-market templates, quote CLI, privacy-check, and interactive dashboard."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
irt-quote = "cli.quote_fetch:main"
irt-privacy = "cli.privacy_check:main"
irt-notify = "cli.email_digest:main"

[tool.setuptools.packages.find]
include = ["cli*"]
